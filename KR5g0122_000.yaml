十四真飛行八晨精通神見靈旗紛陳隂氣成雨陽氣成雲三氣合變天罡揚輪徹洞六合燭曜七門散陽召虎引隂召龍流電孛落運煥雷風前帶火甲後鳴天鐘紫翠上造擲鈴八方飛羅羽文遊行仙宫白元携魄無英提魂中央黃老扶我身神我遂升天得為真仙讀畢內視輒存三元三素所在成道之根萬遍既畢不死神仙洞房畢矣愼不妄傳常讀經三過冥目閉氣存明堂宫左絳臺青房右黃闕紫戶次存洞房宫金室紫蓋上左無英君右白元君並紫華冠龍裙鳯帔中央黃老君如始生嬰兒黃繡華衣三神並坐外向心呼神名曰左無英神公子右白元洞陽君中央黃老君伯桃三過次存三宫各三素氣泥丸中有覆北斗三神服色如守一法心呼神名三過次存命門大君正當臍中紫扶冠朱羽帔飛丹裙心呼曰命門大君孩道康合精延三遍咽液五十過萬遍成仙矣大洞洞靈揮魔之符書于拜壇上大素真人隱朝禮𩓑上仙經法受大洞上訣施行雌一讀大丹隱玄玉晨金華經者當月月密朝太素三元君以正月十日二月九日三月八日四月七日五月六日六月五日七月四日八月三日九月二日十月十一日十一月十二日十二月十三日夜於靜寢之室燒香北向心存三元君再拜訖坐卧任意稽首心祝曰謹啓太上大道髙虛玉晨太素紫宫三元帝君中央黃老無英白元玉皇大帝五老髙真太極皇精玄皇玉君某甲是大洞三景弟子謹以吉日之夜天關九開之間上聞太上太素三元三素元君玉皇真君前乞得長生度世上夀無極億年時乘華晨緑蓋龍轅上詣紫庭役使萬神侍衛四明太素帝君畢心拜三過仰咽九過止常當行之勿令人知也此太極真人隱朝三元夜禮𩓑之道也昔常安季仲子不知他道又亦不施行大丹之事三元之法惟偶得此隱朝之道守行之三十年得乘雲駕飈升入玄洲也仙人王履冰趙𩀱成范叔友管平阿李明賢延安生之輩皆得此道而升崑崙之房或在神洲或在玄宫也太素三元君女子也德隱虛無神髙太上教制天真領理萬氣積感瓊琅虛生霄晨結煙散景道陵玉真夫三元君之出遊也則日月傾曜列燭拔根八風洞波飈蕩幽源連暉九萬髙霄儛晨絳霞鬱敷黃雲九纒於是五老啓途大帝扶軒西皇秉節東華揚幡九天為之低回太無為之起煙幽氣隱藹八景連塵顧盻羅於無上俯仰周於百貟大哉髙皇是曰太素三元君夜在密室常存三元君來在我室中心拜心語如是不替則所向如𩓑萬事克和此為真人致神仙之要法也太素三元君服紫氣浮雲錦帔九色龍錦羽裙建寶琅扶晨羽冠腰流金火鈴虎符龍書而坐於太空之中膝下常有丹緑青三素之雲氣鬱然冠覆真形也太素三元君詠曰太無連玉清三曜洞髙明八景回神風散雲藹飛靈圎輪擲空洞金映冠天精玉華結五老紫煙運霄軿乘氣蕩玄房委順拔所經金姿曜九霞玉質躍寒庭幼童回孩盻耆艾還反嬰帝一固泥丸九真保黃寧視盻萬劫外齊此九天傾心拜咽液三過畢若存念之時當諷此詠之作云是玉清上宫之唱以和於形魂之氣也若存三元君者首作頽雲三角髻餘髮散垂至腰中髻上乃著扶晨冠耳子存感至若亦將見之於紫房及左右也比者之間當有太素玉女三室真人來降於子矣欲行此道常當别寢獨處不雜他人每事亦爾非惟此一事而巳太素真人教始學者辟惡夢法若數遇惡夢者一曰魄妖二曰心試三曰尸賊此有厭消之方也若夢覺便起坐以左手苐二指捻人中三七過啄齒三七通而微祝曰大洞真玄長練三魂常守七魄苐一魂速守七魄苐二魂速守泥丸苐三魂守心節度速啓太素三元君某向遇不祥之夢是七魄逰尸來協萬邪之源急召桃康護命上告帝君五老九真皆守體門黃闕神師紫戶將軍把鉞握鈴消滅惡津反凶成吉生死無緣畢又卧必獲善應向造為惡夢之氣則受閉於三關之下也三年之後惟感應而有夢也夢皆如見將來之明審也略無復惡夢仍無不祥之想也若夜遇善夢者吉應好夢而心中自以為佳則吉感也卧覺當摩目二七遍急閉目以兩手掌從內向外摩之叩齒二七而微祝曰太上髙精三五丹靈絳宫明徹吉感告情三元守魄天皇授經所向諧合飛仙上清常與玉真俱㑹紫庭畢此大洞祕訣以傳於始涉津流者也常以二月二日三月三日八月八日九月九日十月十日夜於寢室存思洞中訣事而獨處不眠者吉其夕衛經玉童守經玉女乃奏三元與太極典禁真人共於室中而詳察子之云為也是其夜常當燒香左右研心若有所待也坐卧存思或讀洞經念真存思紫房施行雌一在意為之惟不可以其夕施為他事非求道之方也若乘清於其日益善非惟守夜受洞經之始常當修此玉晨明鏡金華洞房雌一五老寶經法此經一名三元玉晨經一名雌一隱玄經皆天真髙仙常所存修也故感動三素積結靈元三真挺生乘霄駕晨併景回曜內造幽根化成女子體具威神登空入無兩眉之間五老寶靈是故謂之雌一焉雌一洞房三素髙元君者是太素三元君之子靈豁九霄洞暢龍玄散花玉空胞胎靈津神氣流於明暉清景秀於腋間三女俱誕號曰三素元君三素元君者太素三元君之女也紫素左元君黃素中央元君白素右元君白素右元君者是白素洞陽君之毋太素三元君之子也白素元君諱啓明蕭仞字金門上是乃憑玄積感協氣幽𥘉凝寶五道受胎虛空而結形為女子貌常如嬰兒之狀上著龍文白錦帔下著白錦飛華裙頭建紫華晨嬰之冠腰帶神金二虎符左手執流金火鈴右手執太上智慧經白素元君口中常吐出白氣以纒繞存思者身名曰玉晨白寶生魂之氣以熏我使我神仙不死也黃素中央元君者是中央黃老君之毋太素三元君之子也黃素元君諱圎華黃刃字太張上是乃積胎太無虛感空洞凝生散華遂育玄中受生為女子號曰黃素髙元君曜形有黃金之質貌如嬰兒之狀上著黃錦雲帔下著黃羅飛華之裙頭建紫華芙蓉冠腰帶神金二虎符左手執流金火鈴右手執大洞真經黃素元君口中常吐黃氣以纒繞存思者身名之曰玉晨黃寶太靈生五藏之氣以薰我使我飛仙升天紫素左元君者是無英元素君之毋太素三元君之子也紫素元君諱翳鬱無刃字安來上是乃秀霄纒景羅結太無虛胎空曜順氣育華積習上精遂成女軀神鏡八方而貌少嬰孩也上著虎錦紫華帔下著紫華龍文裙頭建紫晨芙蓉冠御紫晨𩀱珠蓋腰帶流金火鈴又佩神金月明二虎符左手執太上消魔經右手執金真玉光章紫素左元君口中常吐紫氣以纒繞存思者身名之曰玉晨紫寶命胎流霞之景煙以薰我身使我白日升晨上登玉清上宫金華雌一洞房所在也使人面南向從兩眉間直北却入深一寸為明堂宫二寸為洞房三寸為丹田四寸為流珠五寸為金華雌一洞房宫或曰三元五老寶宫兆存念雌一混合雌雄常令在此宫中令辟方一寸一寸之中央正圎如鐶鐶皆赫然有朱丹之光也直北深入五寸住項後之方乃逹金華洞房宫方圎一寸處耳兆常以八節朔望及本命日及大回元五通日隱朝太素之日用生氣之時入室清靜臨目存思忽見金華宫中有金堂玉室在圎寸之中廣狹恍惚非得拘以圎寸之故皆適意倐忽以成之也室中有一紫玉榻方九尺髙三尺榻上有三素髙元君共坐向外面左為紫素元君安來上右為白素元君金門上中為黃素元君太張上其紫素元君之項後戴紫晨𩀱珠之蓋存之服色如上狀三素元君項後各有一寶曜日氣九色圎光朗徹金華洞房一室之中良久三元君於是口吐氣如上法三氣合㑹纒統相著遂歘化為一日象徑九寸在金華洞房之中光明赫赫須㬰日氣之煙照映泥丸之中正赤炯炯日中又忽有三素元君共相抱持俱變形容各如芥子來入滿我口中覺鬱鬱霧氣良久乃更閉目咽唾吞日氣三九過又存令日氣入三素之身洞入我心中下至臍中照徹一身內外肢體五臟當覺泠然有異於是灌魂形陶太素者也是乃都畢名為三素雌一真華煉景或曰玉晨三素乘日濯形也存雌一始畢仍節續又兼存帝君及五神等又於所住六合紫房中各吐紫氣以灌我五臟中鬱然如日之初出洞映腹內通徹萬節一作百骨節於是五臟各生五色華如蓮花之狀忽見三素元君共坐在心華之中忽見帝君太一共坐在肝華之中忽見白元無英黃老君共坐在肺華之中忽見司命桃康二君共坐在脾華之中忽見玄父玄毋共坐在賢華之中臨目念之良久乃畢叩齒二七過微祝曰太上玉晨九微𨗳煙五老散景八靈生門三素寶氣太玄玉晨金華雌室中有紫元混化七九上拔帝君日氣流形灌養萬神貌嬰氣孩首䢖扶冠龍衣緑蓋錦帔虎文上招靈符呼引魂魄養我生我與我長存回曜朗徹保固泥丸無上三氣入虛出丹常與紫素俱列玉仙又祝黃氣九變中央元君髙虛挺素空同無源黃錦雲衣飛龍華裙手執洞經腰帶虎真領理神道徘徊五津從容金房化錬天仙列坐五華玉曜映軒遂俱登虛白日駕晨練景三五七九萬神三玄六府帝君常存日精灌形圎寶纒綿永記玉清與帝因緣又祝浩靈挺生白素元君太上神精感㑹八門龍衣虎帶黃晨華冠領括帝籍總檢玉篇雌雄大混萬變億千有始無終夀如回環各坐藏華五老八間周流紫房駕景飛旋上到九清中盻陽關次遊黃房下憩命門大微曜景三素生空與我共遊長守無窮雌一事畢神還金華洞房行事存思之時亦可眠坐亦可接手膝上一作按手作膝坐隨其所安任其所便也大都向本命為佳要不得匆匆而為靜思也兆存金華洞房雌一之精常當别室寢處不雜服用禁忌哭泣令金房氣襄亦不欲哭泣之聲令三素戚擾又不欲見尸柩之穢令神感不生亦不欲吊臨死家履尸臭氣若服非同類履非同氣則令三宫感散胎神淹沒五辛為伐藏之斧酒色為破身之刀若存雌一深當愼之不可犯也犯者太玄冥考兆所寢之牀當髙處厚褥勿令近地惡氣五毒之薰常起一尺之煙翳兆魂神魂神悶亂則存念不感此施於雌一之精思也是以金華洞房室中三素玉榻髙三尺許也太一帝君洞真玄經存五神法經曰先存太一太一者胞胎之精變化之主魂魄生於胎神命氣出於胞府變合帝君混化為人故太一神生之毋帝君尊生之父太一名務猶收字歸㑹昌又一名解明一名寄類此三元洞玄內寶經之真名字外訣雜鈔云云之名皆非實非真也今此名字甚不可告人自知之者長生不死辟却萬禍能致神靈玉女來降巳矣夕夕當存太一在巳身中六合宫或存太一在兆左右坐卧背向無所不在也皆以生氣時存之畢呪曰太一之精起於太清魂魄受化形影為靈攝御百神拘制三陽帝君玄煙合真㑹昌內安精氣外攘灾殃却除死籍延命永長衣服老少變易無常治在六合周旋絳宫下逹洞門上到玄鄉混合三五遊息天京呼引日月變化雄雌攝召符籍胞胎之囊死生之命太一扶將存太一與兆形正同衣服亦同也是以兆之身常當齊潔而修盛以求㑹景於太一也衣服中物一不得假借於不同氣者諸如此𩔫皆當慎之子既不能服食去穀精思研真矣當節諸臊穢腥血雜食葷辛之菜一為禁絶若能如是以愈矣可以庶生命之長矣左無英公子者結精固神之主三元上氣之神結精由於天精精生歸於三氣矣故無英公子常攝精神之符命也名玄充叔字合符子又一名元素君一名神公子常在玉房上清之內夕夕存思之畢呪曰太上玉真皇精相連三元英氣太玄紫辰九霄挺明五華生煙黃闕金室中有大神握固流鈴首建華冠紫蓋回飈龍衣虎文貌狀嬰兒四靈洞均出丹入虛合形帝君呼隂召陽天道有真名曰玄充叔號為無英君周流九道散化五常攝精生我與我長存右白元君者或曰洞房君也主攝魂魄之氣檢御靈液之神故魂魄生於九靈之宫神液運於三氣之真是以御之者號曰白元洞陽君攝持魂魄之符命焉白元君名鬱靈標字玄夷絶又一名朱精一名啓成治在玉堂上清之內夕夕存思畢呪曰太上神精髙清九宫三氣結變正當神門龍衣虎帶扶命還魂腰佩玉書黃晨華冠把籍持符呼吸混分名曰鬱靈號曰白元與我俱逰上到陽關周旋九清六合之中固養精液泥丸上元百神扶將各鎮寶宫檢御既畢還安黃房中央司命君者或曰制命丈人主生年之本命攝夀夭之簡札太一變魂而符列司命混合而對魂帝君司命之神主典年夀魁柄長短之期是以混合太一以符籍而由之故稱丈人焉名理明初字玄度卿一名神宗一名靈華白日治幽極宫通御隂房出入神廬兩門中夕治在玄室地户之中幽宫之下六合宫之上一界中耳隂房者是鼻之兩孔中也司命出入當由鼻孔不兩眉間也夕在玄室為玉莖之中地戶亦為隂囊中也若女子存之令在隂門之內北極中夕夕存思焉存畢呪曰皇一之魂化成九名混合三真變景帝庭幽極玄户中有天靈周旋七運百神合成攝籌把算司命之精龍衣虎裙冠巾七星常存我已安存我形號為丈人名曰理明上通符命使我長生三元六府萬關條平攝御靈氣與兆合并龍輪徘徊共登太清齊光日月幽幽冥冥刻命青緑天地無傾命門桃君者攝禀氣之命此始氣之君也還精歸神變白化青合規挺矩生立肇冥天地之資元隂陽之靈宗金門玉關房户之寶並制命於桃君之氣也故太一還景帝君合魂還景者俱混洞以萬變合魂者化精液而生也精變之始由桃君以唱以别男女之兆焉桃君名孩道康字合精延一名命王一名胞根白日治在金門五城中是為臍中命門下丹田之宫也夕治在六合中太一之右焉夕夕存思畢乃呪曰玄元結精虛氣合煙胞胎之結隂陽之親太上三氣下入兆身百節受靈萬神各陳混沌為一名為桃君形如始生暉暉衝天衣服五色華綵鳯文手執神符合帝之魂腰帶虎書赤巾丹冠金床玉榻正當命門口吸精氣强我骨筋右有神女手執朱幡左有玉童書記帝言陽氣左行混變未分隂氣右回流形七旋下至無下上詣泥丸常逰九宫出入幽門攝錬魄魂六府之間領録萬神與我俱仙右三五渾合化生五神之法此五神者禀五氣之大靈符玄命之宗也上生虛無下結一身身中之生須五神以起居焉兆當夕夕存思而祝之焉若不能暗諷可白日按文而修不必夜半要生氣時爾夫三魂生於五神三真出於五靈謂此道為混合三五之法焉行之者長生不死明此道日察明堂歷神紫宫生化三五朝胎上元者也雖巳得仙者亦當行之長生也存思之時坐卧任意若坐者得向本命為佳若不能頓思五神者可以先次存二神後存三神周匝復始先從太一始也夫精思存念須得清靜居室山林之中不與人接聲穢濁之氣不聞乃行之師曰存五神法竟然後乃得按大洞雌一呼引日月變化雌雄之道也大洞雌一帝君呼引日月之道兆祝五神畢次存兆一身入紫房坐南向又存兆之左有日象徑九寸又存兆之右有月象徑一尺按日月象並在虛室之中以對兆兩耳間又存兆左手捧日右手捧月兆乃回靣臨日上以口吸日之赤光二七過又轉面臨月上以口吸月之白光二九過於是帝君太一忽從空中來至兆前并五帝君持兆符長一寸廣五分以投日象之中符與日便合形起煙如燒薪之狀太一持兆籍廣一寸長五分以投月象之中籍與月合形起煙如雲霧之狀當存符籍上有兆名姓鄉里之號次存日月二象歘然混化為一明珠如雞子大中黃之狀內外洞徹兆因開口取珠而吞之覺在心中良久祝曰三元髙晨二景清明呼引日月解脫死生胎結開散八煙三庭符籍併曜齊暉圎靈口吞明珠服神上精洞徹內外萬神長寧畢此為呼引日月之精符籍入景之道也次行大洞雌一變化雌雄上仙之道大洞雌一帝君變化雌雄之道兆呼引日月畢次存兆正坐雌一金華洞房中北向於紫玉榻上次存三素元君凡三女子併在兆前虛空中立而向兆又存太素三元君是一女子來兆頭上坐亦北向又存五神太一旡英白元司命桃康君等來立在三素元君之後又存帝君來共坐兆之前向兆之面又存玄父玄毋坐兆膝上玄父處左玄毋處右二人面目相向又存太微少童于景精立在空中對兆兩眼之間又存帝君泥丸中有太一重冥玄君立在空中對兆口前於是凡有五女子之神九男子之神名曰三五七九上到玄門之時也爾乃五女九男皆祼身無衣而形貌並如嬰兒始生之狀其五女九男口中又吐白氣互相纒薰於兆一身鬱鬱霧合良久於是五女九男并兆一身共混合都化作一白氣圎如日之光團團之狀須㬰圓光白氣歘更變為二小兒其一兒是男一兒是女並如初生嬰孩眇眇之狀男號曰九元之真女號曰皇上之魂男名拘制字三陽女名上歸字帝子須㬰又存見男兒拘制女兒上歸並各立在日月中男在日中女在月中其日月懸乎皇天日在東方月在西方當其時也惚惚恍恍自覺兆無復一身巳共化為向者之白氣矣又存聞童子拘制在日中有聲詠曰拘制三陽九元之真是我之號日結我身主人符籍與天為親混合雌雄神仙纒綿又存聞女子上歸在月中有聲詠曰上歸帝真皇一之魂是我之號月結我精主人符籍巳在大明與玄為親夀萬億齡混合雌雄祼身華庭素氣鬱變男女受生永保主人俱升仙庭二童詠畢兆乃始自覺還有兆之一身始復存也於是變化雌雄混合男女之法都訖乃更堅閉目叩齒九通咽液九過祝曰九天之真真有三庭一作田雲霧金室中有五靈拘制威剛變化幽冥回匝玄鏡周緯天經三五復反混合大明陽氣流潤化入無名與我俱仙上至神庭日月相望三光混形越出八極頭冠天精左旋右顧手把七星隱身太微元始氣并畢乃又開目微祝曰真有三田二童之津雲房金室雌雄所遵中有五靈混合所經拘制威剛真仙之堂變化幽冥身升玉清回匝玄鏡八間上慶周緯天經十二𩓑成三五復反七九之管混合大明以至黃寧陽氣流潤帝君伏隱化入無名大變煉形與我俱仙景精來迎上至神庭十方緬平日月相望遺身存童三光混形上皇之靈越出八極三元胎息頭冠天精能死能生左旋右顧形神俱度手把七星漱飲神瓶隱身太微二景齊暉元始氣并萬神敬聽畢此乃變化雌雄大混皇一之道也若不能暗誦此語按文微言而讀之讀畢又存五神各安坐其宫五神並口吐紫氣以纒我身覺紫氣鬱鬱然也內外冥合手足不相見乃止又存日月出我左右頰間左日右月二光洞照於是紫氣豁然而住又存日上我口中因即食之作𥹋味九咽氣止又存月入我臍中當命門下照隂室之間又存我把北斗七星之柄戴以行步入紫房太微宫見帝君其帝君曰子得神仙子得長年我以子上清玉符書大有之天也我再拜曰乞隱太微合景太一列侍帝君周旋靈室存帝君即召太一來帝君前我入太一口中合形一景與太一共為一身良久都畢此名為混合大明化入無冥日月相望手把七星同形太一隱身帝庭者也五老雌一解胞胎死結上仙法此道以本命日或八節日先存紫房金華洞房事畢乃更存紫素元君口呼二十四真上景八神名字俱㑹紫房又存黃素元君口呼二十四真中景八神名字俱會絳宫又存白素元君口呼二十四真下景八神名字俱㑹命門臍宫次又存帝君來入隂極宫隂極宫乃兆隂囊中兩丸間也於是更存見帝君手把三赤絲繩結絲如絃而結如彈丸之狀結輒有八凡二十四結為假赤絲也存帝以一八結付紫素元君又以一八結付黃素元君又以一八結付白素元君其三素元君並以此結各付三八景真人三八景真人各解一結存見二十四結都散而解畢即又存此結散三赤絲鬱然化為一大火以燒兆一身一身之內外皆然如生炭之狀炯炯照徹良久都訖所以為火者人之一身有胞胎大結二十四又有血滯涎中細結乃有百二十結布在肌血之間九關之內故為此火以燒散蕩滅之以炎火開解之耳兆存火燒身既畢續又存北斗七星橫在口中舌上又存太一君足躡斗頭第一星上而立又存無英君躡第二星上而立又存白元君足躡第三星上而立又存司命君足躡第四星上而立又存桃康君足躡第五星上而立五神並嬴身無衣如胎嬰之狀五神乃各吐五色氣以薰北斗七星滿兆口中五色氣出上薰營室營室者兆兩目之黑童也忽見紫素元君坐在兆左目童子中忽見白素元君坐在兆右目童子中忽見黃素元君坐在兆兩眉中間鼻額上三素元君並裸身口各吸取五色氣以自飽滿其紫素元君左手持兆命五符白素元君右手持兆命五籍黃素元君抱持兆三魂三魂者三人也形如兆狀長一尺八寸黃素元君正坐鼻額中向外而詠詠曰三元長留營室之裏玉清帝君定籙更始夀無終極五神所恃畢於是須㬰乃都混化衆神形體及與兆身共合化為一日懸乎東方去地一二丈如日始出之狀光曜暉赫朗映天下昭昭然晃晃然乃覺耳聞太素三元君音聲在日中詠曰我混五氣中共化乘日軿晏觀九霄外吐納七神精盤桓九玄內坐起霞光生三元留營室目瞳朗然明盻顧億萬椿俯仰伯史庭五符付帝子上歸反華嬰相待玉真階携手登劫齡畢良久兆一身恍恍惚惚不覺所以然而然所以聞而聞也於是小開目啄齒五通以左手苐三指捻鼻下人中七過以右手苐三指捻兩眉間九過此為却轡三五七九封制百神門戶之法令百神安兆宫室三真固兆一體五神守兆符命帝君監兆萬關也施行畢又祝曰三五相反天復地始我有五神上皈帝子三元長留營室之裏五色相通方員元紀外禳百凶內拘伯史三真扶我五神護巳躡御魁罡使我不死祝畢存太乙坐六合宫中故與我合形同景也乃還兩手指放所捻處又以兩手掩口微祝曰太一告諸神皆持隂陽關不得妄去其宫室當受制於帝君一如帝君法二如九天令右此是三元五氣解結大變雌一裸形混合於八景也夫知為道而不知變化雌雄用雌一以解結者萬不得生也大洞雌一哺養帝君太一百神上仙法哺養百神雌雄解結之道曰兆之身中有胞胎死結十二又有血滯死節十二凡合結節二十四上結節在泥丸中中結節在五藏中下結節在膀胱中節在結內結在節外結節相似亦謂之二十四結焉人不知解脫結節者亦不免死矣常能解之者得長生久視又常能哺養百神者必得神仙而身生日月之光華兆常以本命日若八節日或朔望日用生氣之特正坐向本命之方接手端心存金華洞房雌一宫中有三素髙元君及帝君玄父玄母凡四女子二男子合六人也同坐玉榻之上又存紫素元君召無英到前立存無英公子口呼二十四真上景八神來到立在在公子後又存黃素元君召中央黃老君到前立存黃老君口呼二十四真中景八神來立黃老君之後又存白素元君召右白元君到前立口呼二十四真下八景神來立白元君之後又存帝君召兆身兆身立在帝君前又存玄父抱兆五符玄母抱兆五籍又存兆左目為日右目為月日月二光共混合兆神庭之中却上入明堂之中化生黃英黃英一名黃水月華其狀正黃如黃金色形如水浡也其味甘如蜜覺黃英之甜下流入兆口中兆口九咽畢又作九咽仰哺帝君其時太一在帝君側帝君受取兆九咽畢帝君自作九咽以哺太一太一受哺畢太一又自作九咽以哺玄父玄父受哺畢玄父又作九咽以哺玄毋玄毋受哺畢其時又存司命桃君二人對立在玄毋間玄毋又自作九咽以哺司命司命受哺畢司命又自作九咽以哺桃君桃君受哺畢於是黃英之華所存哺者亦訖也又覺諸得受哺食月華者皆覺身形作黃金色兆一身亦爾皆晃晃然又復存三素髙元君口中並有回水玉精一名圎明白華一名日華其狀水浡其色如白玉其味如蜜存紫素元君口中作九咽哺以哺兆口中畢紫素元君又自九咽哺以哺無英公子受哺畢又存黃素元君口中作九咽哺以哺兆口中畢黃素元君又作九咽哺以哺黃老君畢又存白素元君口中作九咽哺以哺兆口中畢白素元君又作九咽哺以哺右白元君右白元君受哺畢於是受回水玉精所哺者其形並作白玉色兆一身亦如白玉煜煜然也所存哺者都畢又存二十四神結節忽見在金華洞房中三素髙元君口中歘各生一火凡合三火以燒身三部結節覺炎火生於雌一房結節散於金華之宫爾乃受哺養者飽滿矣死結消散者必神仙也良久都畢更疾閉目而微祝曰幽極玄戶中有天靈常在我已安存我形百神受哺俱㑹神庭日月上華回老反嬰五符五籍太上記名解結金房與帝長生此名哺養百神雌雄解結之道也此法四千年一傳三百日齊戒然後可得授耳大洞雌一太極帝君鎮生五藏上經法太極金華真人以此經文刻於太微天中紫微宫玄琳玉殿東壁牗上其文曰五氣異方津光合形有終而死有始而生萬類反本千條皈冥道氣遍浮煙雲奔流哀哉兆身非真不成何不竭以雲草玄波徊以卉醴華英㑹以五光七白靈蔬和以白素飛龍沐浴平旦正心向東凝精厲魂上帝五公再拜朝靈鎮固五方長生天地出入流通各安其位生華五藏此乃上清八㑹交龍大書非世之學者可得悟之太素真人顯别書字受而服之求其釋注於太極帝君焉雲草玄波者黑巨勝之腴也一名玄水清卉醴華英者蜜也五光七白靈蔬者薤菜也白素飛龍者白石英也其法當種薤菜經五月五日不掘拔者惟就鋤壅護治之耳經涉五年中乃取作藥名為五光七白靈蔬也擇取薤白精肥者十斤黑巨勝腴一斛五斗白蜜如凝雪者五斗髙山玄岩絶泉石乳之清水三十六斛白石英精白無有廉崿者五枚先於磨石上礪護使正圎如雀卵之小小者好瑩治令如珠狀勿令有礪石之餘跡也先清齊一百六十日於九月九日先築土起基髙二尺作竈屋次屋成作竈以竈口向西屋亦開西戶也當得新大鐵釡安竈上於九月九日申酉時向竈口跪東向先投石一枚於釡中祝曰青帝公石三素元君太一司命玄毋理魂固骨鎮肝守養肝神肝上生華使肝永全次又投石一枚於釡中祝曰白帝公石太一所憩玄父理精玄毋鎮肺守養肺神使無朽廢肺上生華千億萬歲次投石一枚於釡中祝曰赤帝公石帝君同音玄毋理血桃康鎮心守養心神使無灰沉心上生華華生玉林次投石一枚於釜中祝曰黃帝公石老君同威太一帝君理魂鎮脾守養脾神使無崩摧脾上生華白日晨飛次投石一枚於釡中祝曰黑帝公石太一同算玄父玄毋理液混變守養賢神使無壞亂腎上生華當得上𩓑投石時皆各閉氣五息然後乃投五石都畢起向竈五再拜又取薤白五斤好積覆於五石之上畢內蜜灌薤上畢內腴一斛五斗灌蜜上畢乃按度腴入釡深淺髙下處所也然後稍入水使不滿釡以木蓋浮蓋釡上九月十日平旦發火當取直理之木熇燥好薪不用蠹蟲及木皮不淨之薪火煮方令覺少沸而已勿使涌溢大沸當屢發視調其下火先當視腴格處所若煮水竭當益水取盡四十六斛水而止又水盡更加煎令减先腴格二寸籌量以意視之都畢成寒之釡中去下火炭密蓋其釡上乃徐取五石平旦五方各再拜畢跪以此腴雜以東流水以次服之飲水及腴取令通石子入口下喉中耳服石之時亦如初投石於釡中時一二按視而服之也又再拜祝曰太隂煉身形勝服九轉丹華容端且嚴面色金靈光五石㑹天真太乙保神關上登太極闕受書為仙人此大洞金華雌一後聖九玄道君外記靈書紫文五老寶經琅玕五石華丹玄腴之法皆結盟以青金指父毋以為誓考七祖以冥都為不漏之長要宣是經為逆天祕是經為得仙若兆逆天也亦安可以求生方身死為下鬼當見七世罹毒於地獄將胡顔以對之哉其經盟之法載于大洞玉經玉訣三十九章之後也大洞真經髙上録中帝君九魂命五神符五神符本經云右此符以碧為地黑書與中央司命符共戴年月日又東華上道云五神符朱書竹膜上每旦對太陽存五神引真氣吞服體生玉光出太素真人傳司命符東華上道云司命符朱書竹膜上每夕對太隂存太乙司命君引氣吞服百神侍衛右出東華併録于此大洞西華玉堂仙毋金丹法先齊三十九日以七月七日中時合此丹凝白蜜二斗真丹精明有白華者叄斤精雲毋屑叄斤凡三物攪令和著銅器中蓋上器以器著大鑊湯中令浮銅器桑木薪火煎鑊令蜜并藥乾於銅器中遂出器凉之三日又曝燥搗為散還納銅器中又密蓋口以器著竈上甑中好桑薪火三十日當以白日竟日蒸之夜不火蒸也日訖出丹作髙格曝燥之又搗三萬杵細篩為散又納著器中蓋器上如𥘉時法著大鑊湯中浮煮銅器三日三夜訖都畢名曰仙丹金丹一名曰西王毋停年止白飛丹凉之三日曝燥更搗三萬杵細篩為散以凝白蜜丸如小豆大平旦服三十丸旦旦服之𢘆服之者長生不死面少容如女子若讀大洞真經而又能服此丹便得長游於世上矣惟此丹無所禁食飲之宜任意耳𢘆在人間周旋俗中人不覺也所謂真仙混合隱化八方矣洞真髙上玉帝大洞雌一玉檢五老寶經
