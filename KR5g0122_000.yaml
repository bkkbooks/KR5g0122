front:
  text: 洞真髙上玉帝大洞雌一玉檢五老寶經
  hash: sha256:487d2a0d483ccdcdc4c9b9f52c323b5aa6b9f011cbc10a5aeb8ec17e77011671
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5g0122_HFL_000-001a, image: hfl/1025/1025-004.png}
body:
  text: 中央黃老君撰右一夫洞真髙上玉帝大洞雌一玉檢五老寶經上願十二玄母八間九轉五回變化雌雄中央黃老大洞真經三十九章者乃祕在九天之上大有之宫太玄靈臺玉房之中紫雲為簡以撰其文青緑為字以書其章上混大帝生變上元中化七九理命長存下關神律領攝萬靈雌雄回㑹華映玉清浩汗冥觀髙上大明者也守衛經者玉女二十七人常典燒香侍護經者玉童二十九人常寶靈文玉童玉女合五十六人禁勑漏泄營視真經記功明善重慎消患矣神光之表異也皆有華晨以摽其真矣爾乃玉華以映玉女之形金晨以冠金童之顔飄飄朗於九玄之上煥明暢於積感之房齊羣六天窈窕虛峯錦帔流鈴飛青羽裙腰帶元符首建晨冠衛護有經之身輔成學為真人者也兆有此經必行其文常當靜隱絶室散香拂塵神棲𡨋林避逺人間幽寂遺事去纍納真豁心忘爭委順洞根獨處幽房絶榖去辛淡味上霄吐液和津單景遣偶冥盻三魂長修苦行過中不餐苦齊三年乃得受讀大洞真經焉皆如盟法不妄輕傳輕泄漏慢禍及其身妄言愆誓不得延年九天寶經太極四真人之所禁有妄授非其人有妄授不審其身者為泄慢天寶得罪太玄萬神告惡千靈致患關罪太上削生帝君身被冥科體絶形塵死為下鬼灌河填山又生死父母並獲罪於地獄受考毒於三官狂殘凋零載禍大冥矣夫患禍之來未有不由輕險之口慶福之彰曷嘗不由積善之來夫形之於鏡影若響之於深谷有逺於近必應於逺逺無不對近無不驗天之所報不疾而速感之所期不行而至可不慎哉太上科令云傳授天書而殃鍾其祖先者是重其宣言之罪防其漏泄之盟耳此經乃玉清帝君倐歘須㬰洞合之化髙玄三素太極上真一曰七變之道太一嬰兒自生之根無英公子萬化之章也故顧盻萬物太玄朗洞倐歘須㬰璇衡順運反嬰自生泥丸保鎮左回九天顚倒七曜七曜運景是謂七變雌一合景帝君內鎮五神八間玄母南面右廽八氣彌綸百萬飛行布散大混嬰童九真受氣玄父北方縱體齊霄參落晨空於是九思存者則金姿曜於東華玉形蛻於帝門神映五老騰躍三元靈羽披空氣結慶雲又能身生水火放光萬仞項負寶曜浮遊九晨分形散景位為上真故得此道者為靈皇之真失此道者下入九地之泉此道之訣乃洞靈大竒又雌雄混一帝君變微太一保神玄母嬰孩三五七九九轉齊暉元感景曜無英所摽棲真致也實難外希是用內思拔滯冥暢者也所以仙可求也以精至為難真人可見養志性為難萬靈可使潔寂為難是以太一帝君以紫房為混合玄父玄母以三台為神明八素隱玄以真思為上㫖祕言以九真為內經神法以精思為至深反童以徹真為得靈大洞以髙上為元始太丹以雌一三素為內精老君以自然為晨尊太上以無英為玄精黃老以志性為道本白元以潔寂為入真真人以氣合而相降仙要以精感而道成於是雌一進於泥丸帝君守於六宫大洞詠於室八音散於九空七考受慧於胎仙獲天福於神方慶玄父於靈都賀玄母於玉房積感發於一寸變鱗蔚於霄峰朗盻九晨身登華軿巍巍深哉福不可量此皆寶訣之貴行子思而為之則白日升天矣欲讀大洞真經當先讀髙上帝君十二𩓑玉清玄母八門行間次又讀中央黃老洞房五神經三年乃得受讀大洞真經所以𨗳引神津通徹靈源保固紫房潔明泥丸攝養太一開𥼶三關守鎮七轉凝和元神混化三五萬化九玄者也轉習胎氣目擊太無容與幽靈神盤空虛十二之𩓑與生而俱八間之行含真而遊黃老所守髙上所書故曰雌一洞房之初也讀之萬遍亦得不死之道也但未得超景浮空竦軿落虛御飊絶轡騰躍三玄又未得命駕八景控霄九晨又未得升入玉清升為髙真耳惟讀大洞真經當得此舉爾然行雌一者當勤苦感㑹研真極微三年之後乃得受讀大洞真經耳要當先守太一混合帝君變化雌雄存理九真次詠大𩓑十二相連又唱八門玄毋之間次讀太丹洞房隱玄以定不死號曰必仙也夫稱元君者皆女子之神也雌一洞房三素元君者是也當先存念洞房三素元君三年乃得受讀大洞真經耳大洞所以為真經者謂存念三元君為難也能微玄精思感至者存見三素元君者則真人之道畢矣白素元君者則是右白元君之毋也子存念之至精者仙道成也黃素元君者是中央黃老君之毋也子存見之則夀萬年矣萬年之外乃升三玄耳紫素元君者則是左無英之毋也若存思洞房而歘頓見三元君者便即白日升天佩流鈴虎符遊行上清太丹隱書以三素為至精此之謂也洞房三素元君白元無英黃老君之毋故號曰三素元君皆女子也三女又共一毋其毋曰太素三元君也太素三元君實一女子耳此一女子又生三女故號三素元君也按無英黃老白元君乃三素三元君之子是太素三元君之孫也虛結空胎憑華而生誕亦在髙上上清寶素九玄玉皇天中乃下入洞房與巳身俱升其三男三君在天華房上元虛之室即白元無英黃老皆男子也受生於虛真以成三男之形禀靈和玉晨上氣故結生虛無而為人非由隂陽㑹胎而成也又白元無英中央黃老皆是上清天真官位之號又亦有真仙之精者受書處位應為此號不必盡虛生也諸天之中皆亦有之矣夫得以虛生者幾洞妙元素合真秀景體齊廣曜神周九玄憑感歘生協氣霄無靈扇上逹升化萬方爾乃呼吸未兆而觸物對應順感所至而天地交降矣夫心不一則百慮臻神不微則氣不真思不感則道不住精不固則去道逺勿得見尸血不以死傷生勿以穢處心焉勿以色不貞勿以醉道焉勿可五味盈勿以二心交焉勿以邪求生勿慮祅魔試焉勿以鬼為靈勿以榮祿進焉勿以美飾盈勿以財為寶焉勿為不平勿以俗為樂焉勿以世位爭勿以競亂真焉勿以耳移聲勿以汚濁纍真仙去爾庭存念無所感實由體不精能識大洞戒萬神泯以寧夫人之所勿為者斯亦多矣若必絶轡虛漠栖心洞門體夷常潔神守幽元頓首經師之牗啓乞重玄之關若強者必弱剛者必缺然後天誠坦於無外洞奧馥爾而旡耳而自然者甚寡學而行之為難子若必為雌一研大洞者勿忘是言大洞真經者世間地上五嶽天中永無此經上清天真尤所寶禁當苦齊三年乃得讀之夫能讀大洞真經三十九章萬遍既畢中央黃老元君上奏太上命丹飈緑蓋之車九靈使者太一司命來迎於子於是五老翼軒八風扇羽神電前驅玉華扶轂即可乘雲駕龍白日升天詣太素三元君宫中受書也即通大洞真經者常得乘黃素二雲役使三十二玉女三十一玉童執青毛之節駕青景之龍佩神虎之符戴芙蓉之冠著紫繡衣丹青飛裙振響流鈴擊拊玉鐘玉真啓月明之鏡金仙佩九玄之章紫蓋四䕃華幡繞輪又帶九赤斑文以用封山召雲旦登太極金堂暮遊太華玄中刻定金書得為髙真掌鎮仙文役使萬神位為太極左卿小有仙王入侍帝宸出宴金庭若總行鬱儀凝景結璘氣遊八素體錬玉晨兼詠三五容與九真太明隱曜頡頏玉玄仰執消魔制味虎文便得驂轡三元定書玉真回軿寒畢羅品髙真位為太極左右仙公使役五司三天仙官玉童玉女隨限侍給如玉帝之科開經皆當屏左右洗手足面目乃得視之又常燒香於左右以表靈德之髙盛以别笈以殊衆妙之門所以和音發詠竦朗八玄氣逹清霄潤澤九津招靈景之幽華瑩朽老以長存爾乃微聲既唱空中散煙感虛無之上皇洞太素之元真朗氣九回神精八經大福享於玄葉元吉散於至親所以生死並得仰扇七世受化南津祖考長保身於丹宫定更生之胎仙大哉妙經巍巍靈章淵邈甚竒慶不可量篇目如左學者識焉中央黃老君所撰玉經訣夫得受大洞之訣洞一上首雌雄合變帝君上𩓑玄毋八間金華隱書斯乃九天帝君懷中禁經也若傳授弟子當先前後告齊各一百日又清齊一百日乃得付之中齊七十日下齊三十九日苦行而相傳授焉不審其人無齊而傳付者經師當死受者失兩目焉齊不苦切經師當病受者失口焉施重於經師不輕寶也灾加於弟子慎口目矣愆重禍於七世患結生於冥考若得此經受傳施行不得愆犯懈替宣傳之約一如寶經饌經師於三齊如奉君父焉老幽室於閒林如寂無人焉存五神於紫房如真靈之在焉非君師父子兄弟之施者必勿受矣示靈真之勿用明守禁之難犯也非君師父子兄弟之室者必勿履矣示趾足之不廣明隱逸之抱一也非君師父子兄弟之服者必勿服矣示天親之勿多明盈溢以自裁也研天精之妙覺絶萬纍之近想而至行彰於辛苦絶跡同於無景三餐足於山澗密誠著於逺近爾乃星馳於五老之室德舉於三清之上保內凝於明玉使衣巾解而不穢念三元於泥丸守九真於形宅吐納五華呼吸玉液朝暮求仙於空洞寢息啓神於太漠孜孜不倦勤勤不息如此之人始可與求大洞之門戶預求道之妙想矣奉之者登三晨遊九霄違之者沒三途入九幽夫傳授之者當令經訣再出勿頓授也先授法訣者如令其施行存想精錬五形感念紫房流穢薄清專貞守一旦夕朝靈故大丹隱玄號曰金華經三元玉晨是曰雌一精也按修存雌一三年之後乃又得受大洞三十九章耳今受得此訣亦使得訣事必獲神仙不必俱待大洞真經而一通之也凡欲遊行五嶽歷觀羣山留形停白保夀劫年未欲飛騰逺離世間者便可以太嵗本命八節之日單誦玉清隱祝內思百神一遍不煩誦玉經也如此百遍則氣參晨霄百神內纒千遍三元下降刻名帝編長保日月天地長年萬遍道僃乘雲駕龍遊行太空領括神仙此道髙妙非真不傳夫存感篤誠合真對景三元見矣自獲此經玄靈降授黃老告符運靈引曜五老散華空中受之即登太無能知大洞真經一名九天太真道德經此經之作乃自玄微十方元始天尊所運氣撰集也西王毋從元始天王受道乃共刻於北元天中録那邪之國靈鏡人鳥之山闍梨之岫於虛空之中聚九玄正一之氣結以傳上清八真中央黃老君使教授方當為真人上升三晨者也故世無其文得之者少玉童玉女面上皆有玉華金晨之光映曜一形其無此者不可使佩月蓋以登大有不可使採芝掇隱華又不可令乘飊歘之輿攀緑軒之轅上升九霄也當勤思用苦研甄靈微然後道乃來百真乃濟也自不能抱心至行苦味幽求者徒自咎矣何所望哉夫大洞之經乃九天之竒訣上元太素君金書之首經也皆中央黃老君隱禁此經世無知焉惟太玄有金閣玉名瓊劄紫簡三元有併晨隱録丹臺有黃字之人將是當必為真人者乃得受之受讀此經萬過即使白日升天上登上清受書太極拜為髙仙左卿又但有此經不得讀之者太微天帝君拔出死簡於受經之始定真録於造齊之初度籍太極刻名東華關奏太上録封龜臺萬靈千神自稱兆為太玄大夫其位准應太清仙伯以此遊行天下無所斷絶神仙之行常與吉利諧合者若入山林深谷絶澤多有惡獸石毒及山川多蛟魅妖精之邦房廟有强鬼之處但北面祝大洞真經三十九章篇名次三過畢叩齒三十九通而止則山精百害不敢犯於子也又北向祝曰太上九神八靈嚴張吾是小有真晨太極左卿昔受神師口訣煞邪之方又受大洞真經三十九章左有辟非龍虎右有火甲金鋒前後監兵以降不祥玉晨玉女侍我燒香其山精房尉速來奉迎謁見啓分當如大洞上法呪畢叩齒二十七止也此乃謂未受經之時大洞真經祝法也自一得經之後出入幽冥山精惡鬼皆不敢近人役使萬神招龍召雲遊行絶玄名山之神皆來奉迎無所不通也又玉童玉女常自侍經衛人行來出入凡百所向𢘆念存之每以手撫心祝曰大洞真經上皇玉帝拘魂制魄萬靈見詣次又手摩洞房二七過隂祝曰上元三君紫蓋華晨玉童護神玉女安魂五藏百靈攝養我身長生天地上為髙仙日月伏息七星保真太上受書三華據因呪畢又叩齒三通以辟內外強𦍙之氣諸言後聖者皆是後得道之君大洞金書上皇合真三元羅景太上齊靈晨中比曜七微均清者乃得稱為後聖爾但得讀此經止可乘雲駕龍位為真公卿晏寢九玄傲嘯八方揚羽廣寒儛輪空同故是真人而巳不得稱後聖也但長齊苦行而為此洞經者自得長生神仙若有此經而不長齊存思而與俗行混雜者亦不失隱存下仙白日尸解及命過太隂充地下主者或遺骨胎受化南宫是宿有骨録應得此經者必為仙公故也夫仙者之去世也或絶迹藏往而內棲事外或解劎代形遺杖唯身飄然雲霧延神寄玄悠悠流俗鮮有識其端緒之蹤矣若名山五嶽精思彌稔或久逺人間斷絶塵藹或天真授書髙仙傳告或感動五神三元啓示潜求密悟寂然無類熙歡足於方寸體成隱於靈駕歘爾登斐舋之軿超然升凌空之轂仰扇空洞足懸五嶽手把明霞氣陶介福寤寐之頃巳有九萬之隔是以得道之舉難以常録微乎深哉豈徒不信而巳矣洞經寶貴有經者為師受經者則弟子也丹心竭苦崇之勿替受之不得私有所語所語者則冥中必損奪一經則减一玉童一玉女天真之科巳有定於太初也過語二人則不復為真人過語三人則不得為仙人若語不信道德之人則玉童玉女上啓太上髙上玉帝君則兆失道矣身亦殞也經使自去不覺而失或燒山燔屋風刀劫賊而期於凶失之也兆為下鬼七祖考罰甚可悲也讀帝君隱書及施三素洞房雌一者常即一明鏡徑六寸五寸四寸者銅鐵無拘惟欲得明浹清而無瑕穢者常懸之於頭寢之間以和三神制萬邪也大洞真經天真之玉訣金書玉字之元篇得之者飛步空玄騰雲乘虛上補髙仙長生飛行者是也大有者九天之紫宫故以大有為名小有者清虛三十六洞天之首洞玄隱精元晨之寶宫也大小有中靈書神經時有不具惟西龜之山玄圃之上積石之隂金堂玉室之中有大洞八素髙玄羽章乃都僃耳是當得道有骨録應為真人者乃得受之受之必能乘雲駕龍役使萬神學仙之士百萬之夫無有一人得見其篇目也上天金闕方諸青府及地官皆逆刻簡於未生之前當得受聞之也得之者皆為真仙之師友得大洞真經者欲召司命司録去巳及所念人死籍勑三官乞除俗罪之名又校泰山民命之簿者有七轉洞經之法當先讀太極道經次讀真陽經次讀太一經次讀九老經次讀青童經次讀後聖李君經次讀小有中經都畢一月得作五變七轉七轉者讀七過也謂之一通一月之中得作五通謂之五變洞經自有文不得多為也召司録攝三官去死籍任意制之七轉一通既畢司録立至臨事施行亦當召神人靈感以教悟子之中心者也大洞真經後有三舉方丈震靈之符字方一丈以朱書名山石上以召北帝司命五嶽真人及泰山三官也兆當坐此符上向北面作七轉洞經一通而萬神立到以問死生削除録籍之事當自稱為大洞大夫太上主者也此符是一符或曰三真靈符别有注訣以綵繒為地衣四方各一丈朱書彌滿其上捲方大小隨意廣俠常當內褥中坐卧此符而讀誦洞經存思帝一以行大洞之事又一法坐卧此符辟方三尺而容符文不必拘一丈也大洞真經自有西華玉堂仙毋金丹經乃可清齊合之丹成服之可以歸還人間飲食入俗周旋凡塵故自位為真仙所以隱化八方也若讀大洞真經而不服此丹者便待萬遍既畢立乘雲升天不得復住世間歡喜於凡塵中也若三百日時服此丹便得長遊於世夫得大洞真經者太極真人巳先試之皆過然後得見此經而亦不復待萬遍而試之也通經注真得太極仙公仙卿可登九霄侍晨三元君也大洞內真品有黃寧內祝之法曰黃寧者命門之遊神常與桃康大君上入黃室在乳中心上一寸也當以黃昏時叩齒二七遍手摩兩乳上咽液七過祝曰桃康大君胎生內晨珠衣佩鈴散氣七源紫蓋華冠正當命門扶身安神攝錬三魂長生駕景白日升仙黃室真人被服黃精和真流氣周行一形呼魂制魄使遂長生左引右拘隱身黃靈乃乘雲輦上到上清祝畢使人魂魄安寂數有吉感太素上靈經曰受大洞真經許五百年內得三授過此不得復出若反胎藏往滅迹去世終度之間即其人也可㫖付之若無其人其終俱歸太隂之室苟非其人父子傳示故犯冥考也七祖罹殃兆慎之哉九天太真道德經篇目髙上虛皇君道經第一上皇玉虛君道經第二皇上玉帝君道經第三上皇先生紫晨君道經第四太微天帝君道經第五三元紫精君道經第六真陽元老元一君道經第七上元太素三元君道經第八上清紫精三素君道經第九青靈陽安元君道經第十皇清洞真道君道經第十一髙上太素君道經第十二皇上四老道中君道經第十三玉晨太上道君道經第十四太清大道君道經第十五太極大道元景君道經第十六皇初紫靈元君道經第十七無英中真上老君道經第十八中央黃老君道經第十九青精上真內景君道經第二十太陽九氣玉賢元君道經第二十一太初九素金華景元君道經第二十二九皇上真司命君道經第二十三天皇上真玉華三元君道經第二十四太一上元禁君道經第二十五元虛黃房真晨君道經第二十六太極主四真人元君道經第二十七四斗中真七晨散華君道經第二十八晨中黃景元君道經第二十九金闕後聖太平李真天帝上景君道經第三十太虛後聖元景彭室真君道經第三十一太玄都九氣丈人主仙君道經第三十二洞清八景九玄老君道經第三十三東華方諸宫髙晨師玉保王青童君道經第三十四扶桑大帝九老仙皇君道經第三十五小有玉真萬華